    <rect x="70" y="130" width="80" height="28" rx="0" fill="#f3f0ff" stroke="#5f3dc4"/><text x="110" y="149" fill="#5f3dc4">Nat</text>
    <rect x="205" y="130" width="90" height="28" rx="0" fill="#fdecea" stroke="#e5322d"/><text x="250" y="149" fill="#e5322d">bvar 0</text>

    <rect x="485" y="40" width="110" height="28" rx="0" fill="#fff4e6" stroke="#d9480f"/><text x="540" y="59" fill="#d9480f">forallE (x)</text>
    <rect x="430" y="130" width="80" height="28" rx="0" fill="#f3f0ff" stroke="#5f3dc4"/><text x="470" y="149" fill="#5f3dc4">Nat</text>
    <rect x="570" y="130" width="80" height="28" rx="0" fill="#f3f0ff" stroke="#5f3dc4"/><text x="610" y="149" fill="#5f3dc4">Nat</text>
