<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" width="720" font-family="Inter Tight, sans-serif">
  <rect width="720" height="210" fill="#fff"/>
  <g font-size="12">
    <rect x="10" y="20" width="167" height="170" rx="0" fill="#fff4e6" stroke="#d9480f"/>
    <text x="24" y="46" font-weight="800" fill="#d9480f">SORT</text>
    <text x="24" y="72" font-family="JetBrains Mono, monospace" fill="#1f2430">Expr.sort u</text>
    <text x="24" y="104" fill="#1f2430">↦ Sort (u+1)</text>
    <text x="24" y="160" fill="#5b6475">υπολογισμός</text>
    <text x="24" y="176" fill="#5b6475">επόμενου level</text>

    <rect x="187" y="20" width="167" height="170" rx="0" fill="#e8f8fa" stroke="#0c8599"/>
    <text x="201" y="46" font-weight="800" fill="#0c8599">VAR</text>
    <text x="201" y="72" font-family="JetBrains Mono, monospace" fill="#1f2430">x (τοπική)</text>
    <text x="201" y="104" fill="#1f2430">↦ T, αν (x : T) ∈ Γ</text>
    <text x="201" y="160" fill="#5b6475">αναζήτηση</text>
    <text x="201" y="176" fill="#5b6475">στο context Γ</text>

    <rect x="364" y="20" width="167" height="170" rx="0" fill="#f3f0ff" stroke="#5f3dc4"/>
    <text x="378" y="46" font-weight="800" fill="#5f3dc4">CONST</text>
    <text x="378" y="72" font-family="JetBrains Mono, monospace" fill="#1f2430">Expr.const c</text>
    <text x="378" y="104" fill="#1f2430">↦ T, αν (c : T) ∈ Σ</text>
    <text x="378" y="160" fill="#5b6475">αναζήτηση</text>
    <text x="378" y="176" fill="#5b6475">στο environment Σ</text>

    <rect x="541" y="20" width="169" height="170" rx="0" fill="#ebfbee" stroke="#2b8a3e"/>
    <text x="555" y="46" font-weight="800" fill="#2b8a3e">LITERAL</text>
    <text x="555" y="72" font-family="JetBrains Mono, monospace" fill="#1f2430">Expr.lit l</text>
    <text x="555" y="104" fill="#1f2430">↦ Nat ή String</text>
    <text x="555" y="160" fill="#5b6475">προκαθορισμένος</text>
    <text x="555" y="176" fill="#5b6475">τύπος ανά είδος</text>
  </g>
</svg>
