<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="700" font-family="Noto Sans, sans-serif">
  <defs><marker id="cs-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b6475"/></marker></defs>
  <rect width="700" height="290" fill="#fff"/>
  <text x="350" y="30" text-anchor="middle" font-size="16" fill="#1f2430">Έλεγχος του t : T — τρία ερωτήματα</text>
  <rect x="20" y="55" width="200" height="96" rx="0" fill="#fdecea" stroke="#e5322d" stroke-width="2"/>
  <text x="120" y="83" text-anchor="middle" font-weight="700" fill="#e5322d">① Type validity</text>
  <text x="120" y="109" text-anchor="middle" font-size="14">Είναι το T τύπος;</text>
  <text x="120" y="131" text-anchor="middle" font-size="13" fill="#5b6475">T : Sort u ?</text>
  <rect x="250" y="55" width="200" height="96" rx="0" fill="#e8f8fa" stroke="#0c8599" stroke-width="2"/>
  <text x="350" y="83" text-anchor="middle" font-weight="700" fill="#0c8599">② Type inference</text>
  <text x="350" y="109" text-anchor="middle" font-size="14">Ποιος είναι ο τύπος A του t;</text>
  <text x="350" y="131" text-anchor="middle" font-size="13" fill="#5b6475">t : A</text>
  <rect x="480" y="55" width="200" height="96" rx="0" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2"/>
  <text x="580" y="83" text-anchor="middle" font-weight="700" fill="#2b8a3e">③ Compatibility</text>
  <text x="580" y="109" text-anchor="middle" font-size="14">A ≡ T ?</text>
  <text x="580" y="131" text-anchor="middle" font-size="13" fill="#5b6475">definitional equality</text>
  <path d="M222 103 H246" stroke="#5b6475" stroke-width="2" marker-end="url(#cs-c)"/>
  <path d="M452 103 H476" stroke="#5b6475" stroke-width="2" marker-end="url(#cs-c)"/>
  <path d="M120 153 V195" stroke="#e03131" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="20" y="195" width="200" height="72" rx="0" fill="#fff5f5" stroke="#e03131"/>
  <text x="120" y="219" text-anchor="middle" font-weight="700" fill="#e03131" font-size="14">✗ invalid type</text>
  <text x="120" y="242" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13">(5 : 6)</text>
  <text x="120" y="259" text-anchor="middle" fill="#5b6475" font-size="12">6 : Nat, και το Nat δεν είναι Sort</text>
  <path d="M580 153 V195" stroke="#e03131" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="470" y="195" width="220" height="72" rx="0" fill="#fff5f5" stroke="#e03131"/>
  <text x="580" y="219" text-anchor="middle" font-weight="700" fill="#e03131" font-size="14">✗ type mismatch</text>
  <text x="580" y="242" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13">((5 : Nat) : Bool)</text>
  <text x="580" y="259" text-anchor="middle" fill="#5b6475" font-size="12">Nat ≢ Bool</text>
</svg>
